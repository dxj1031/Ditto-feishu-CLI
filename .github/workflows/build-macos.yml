name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app (unsigned)
        run: npm run dist

      - name: Prepare signing keychain (if provided)
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${CERT_P12:-}" ]; then
            echo "CERT_P12 is not set. Skipping signing keychain setup."
            exit 0
          fi
          echo "$CERT_P12_PASSWORD" >/tmp/.certpw
          echo "$KEYCHAIN_PASSWORD" >/tmp/.kpw
          echo "Decoding P12..."
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k ~/Library/Keychains/build.keychain -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign || true
          security list-keychains -s ~/Library/Keychains/build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" ~/Library/Keychains/build.keychain || true

      - name: Write Apple API key for notarization (if provided)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "${APPLE_API_KEY:-}" ]; then
            echo "APPLE_API_KEY is not set. Skipping notarization API key setup."
            exit 0
          fi
          echo "Writing Apple API key..."
          echo "$APPLE_API_KEY" | base64 --decode > ./AuthKey_${APPLE_API_KEY_ID}.p8
          ls -l ./AuthKey_${APPLE_API_KEY_ID}.p8
          echo "Set env vars for electron-builder"
          echo "APPLE_API_KEY_PATH=./AuthKey_${APPLE_API_KEY_ID}.p8" >> $GITHUB_ENV
          echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}" >> $GITHUB_ENV
          echo "APPLE_API_ISSUER_ID=${APPLE_API_ISSUER_ID}" >> $GITHUB_ENV

      - name: Build macOS app (signed and notarized if keys present)
        run: npm run dist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist
