name: Test FeishuSetup macOS Delivery

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/test-macos.yml"
      - "dist/FeishuSetup-macos.zip"
      - "dist/FeishuSetup-macos/**"
      - "scripts/create-zip-with-modes.mjs"
      - "scripts/macos-terminal-setup.mjs"
      - "scripts/start-feishu-setup.command"
      - "src/setup-core.mjs"
  workflow_dispatch: {}

jobs:
  test-delivery:
    name: Unpack and run mocked setup on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ZIP_NAME: FeishuSetup-macos.zip
      DELIVERY_DIR: FeishuSetup-macos
      WORKDIR: ${{ github.workspace }}/workdir
      SHIM_DIR: ${{ github.workspace }}/mock-bin
      MOCK_HOME: ${{ github.workspace }}/mock-home
      MOCK_WORKSPACE: ${{ github.workspace }}/mock-workspace
      START_LOG: ${{ github.workspace }}/start-run.log
      SUMMARY: ${{ github.workspace }}/final-summary.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Runner arch: $(uname -m)"
          sw_vers
          echo "dist listing:"
          ls -la dist || true

      - name: Unpack delivery package
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/$ZIP_NAME"
          rm -rf "$WORKDIR" "$MOCK_HOME" "$MOCK_WORKSPACE" "$SHIM_DIR"
          mkdir -p "$WORKDIR" "$MOCK_HOME" "$MOCK_WORKSPACE" "$SHIM_DIR"
          unzip -l "dist/$ZIP_NAME"
          unzip -q "dist/$ZIP_NAME" -d "$WORKDIR"
          test -d "$WORKDIR/$DELIVERY_DIR"
          ZIP_BYTES="$(stat -f %z "dist/$ZIP_NAME")"
          if [ "$ZIP_BYTES" -gt 1048576 ]; then
            echo "Delivery zip is too large for lightweight mode: $ZIP_BYTES bytes"
            exit 9
          fi

      - name: Validate lightweight launcher
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR/$DELIVERY_DIR"

          test -f start-feishu-setup.command
          test -x start-feishu-setup.command
          test -f app/terminal-setup.mjs
          test -f app/setup-core.mjs

          if grep -q $'\r' start-feishu-setup.command; then
            echo "CRLF detected in launcher"; exit 10
          fi

          BOM="$(xxd -p -l 3 start-feishu-setup.command || true)"
          if [ "$BOM" = "efbbbf" ]; then
            echo "UTF-8 BOM detected in launcher"; exit 11
          fi

          SHEBANG="$(head -n 1 start-feishu-setup.command)"
          if [[ "$SHEBANG" != "#!"* ]]; then
            echo "Missing launcher shebang"; exit 12
          fi

          NODE_ARCH="x64"
          if [ "$(uname -m)" = "arm64" ]; then
            NODE_ARCH="arm64"
          fi

          if [ -e "runtime/node-v24.15.0-darwin-${NODE_ARCH}.tar.gz" ]; then
            echo "Node runtime tarball must not be bundled in lightweight mode"
            exit 13
          fi

      - name: Create mocked Feishu CLI toolchain
        shell: bash
        run: |
          set -euo pipefail

          cat > "$SHIM_DIR/open" <<'SH'
          #!/usr/bin/env bash
          echo "[mock open] $*" >> "${FEISHU_CI_OPEN_LOG:-$HOME/open.log}"
          exit 0
          SH

          cat > "$SHIM_DIR/npm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          if [ "${1:-}" = "--version" ]; then
            echo "11.13.0-macos-ci"
            exit 0
          fi
          if [ "${1:-}" = "install" ] && [ "${2:-}" = "-g" ] && [ "${3:-}" = "@larksuite/cli@latest" ]; then
            cp "$SCRIPT_DIR/lark-cli-template" "$SCRIPT_DIR/lark-cli"
            chmod +x "$SCRIPT_DIR/lark-cli"
            echo "[mock npm] fallback lark-cli install"
            exit 0
          fi
          echo "[mock npm] unsupported args: $*" >&2
          exit 2
          SH

          cat > "$SHIM_DIR/npx" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          SKILLS=(
            lark-approval lark-attendance lark-base lark-calendar lark-contact
            lark-doc lark-drive lark-event lark-im lark-mail lark-markdown
            lark-minutes lark-okr lark-openapi-explorer lark-shared lark-sheets
            lark-skill-maker lark-slides lark-task lark-vc lark-vc-agent
            lark-whiteboard lark-wiki lark-workflow-meeting-summary
            lark-workflow-standup-report
          )

          if [ "${1:-}" = "--version" ]; then
            echo "11.13.0-macos-ci"
            exit 0
          fi

          if [ "${1:-}" = "--yes" ] && [ "${2:-}" = "@larksuite/cli@latest" ] && [ "${3:-}" = "install" ]; then
            cp "$SCRIPT_DIR/lark-cli-template" "$SCRIPT_DIR/lark-cli"
            chmod +x "$SCRIPT_DIR/lark-cli"
            echo "[mock npx] official Feishu CLI install"
            exit 0
          fi

          if [ "${1:-}" = "skills" ] && [ "${2:-}" = "add" ] && [[ " $* " == *" --list "* ]]; then
            echo "[mock npx] Found ${#SKILLS[@]} skills"
            printf '  %s\n' "${SKILLS[@]}"
            echo "  deprecated/reference names that must be ignored: lark-cli lark-whiteboard-cli"
            exit 0
          fi

          if [ "${1:-}" = "skills" ] && [ "${2:-}" = "add" ]; then
            SKILL=""
            PREV=""
            for ARG in "$@"; do
              if [ "$PREV" = "--skill" ]; then
                SKILL="$ARG"
                break
              fi
              PREV="$ARG"
            done
            if [ -z "$SKILL" ]; then
              echo "[mock npx] missing --skill" >&2
              exit 3
            fi
            mkdir -p "$HOME/.agents/skills/$SKILL"
            printf -- "---\nname: %s\ndescription: macOS CI mock skill\n---\n# %s\n" "$SKILL" "$SKILL" > "$HOME/.agents/skills/$SKILL/SKILL.md"
            echo "[mock npx] AI Agent Skill installed: $SKILL"
            exit 0
          fi

          echo "[mock npx] unsupported args: $*" >&2
          exit 2
          SH

          cat > "$SHIM_DIR/lark-cli-template" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          STATE_DIR="${FEISHU_CI_STATE_DIR:-$HOME/.feishu-ci-state}"
          mkdir -p "$STATE_DIR"

          if [ "${1:-}" = "--version" ]; then
            echo "lark-cli version 99.0.0-macos-ci"
            exit 0
          fi

          if [ "${1:-}" = "update" ]; then
            echo "[mock lark-cli] update completed"
            exit 0
          fi

          if [ "${1:-}" = "config" ] && [ "${2:-}" = "show" ]; then
            if [ -f "$STATE_DIR/config.ok" ]; then
              echo '{"appId":"mock_app","appSecret":"****","brand":"feishu","profile":"macos-ci","users":"Mock User (ou_mock)"}'
              exit 0
            fi
            echo "[mock lark-cli] no config yet" >&2
            exit 1
          fi

          if [ "${1:-}" = "config" ] && [ "${2:-}" = "init" ]; then
            echo "https://open.feishu.cn/macos-ci/config"
            touch "$STATE_DIR/config.ok"
            exit 0
          fi

          if [ "${1:-}" = "auth" ] && [ "${2:-}" = "status" ]; then
            if [ -f "$STATE_DIR/auth.ok" ]; then
              echo '{"appId":"mock_app","brand":"feishu","identity":"user","tokenStatus":"valid","userName":"Mock User","userOpenId":"ou_mock"}'
              exit 0
            fi
            echo '{"appId":"mock_app","brand":"feishu","identity":"user","tokenStatus":"missing"}'
            exit 1
          fi

          if [ "${1:-}" = "auth" ] && [ "${2:-}" = "login" ] && [ "${3:-}" = "--recommend" ]; then
            echo '{"verification_url":"https://accounts.feishu.cn/macos-ci/auth","device_code":"CI-DEVICE-CODE"}'
            exit 0
          fi

          if [ "${1:-}" = "auth" ] && [ "${2:-}" = "login" ] && [ "${3:-}" = "--device-code" ]; then
            if [ "${4:-}" = "CI-DEVICE-CODE" ]; then
              touch "$STATE_DIR/auth.ok"
              echo "[mock lark-cli] auth completed"
              exit 0
            fi
            echo "[mock lark-cli] invalid device code" >&2
            exit 1
          fi

          echo "[mock lark-cli] unsupported args: $*" >&2
          exit 2
          SH

          chmod +x "$SHIM_DIR/open" "$SHIM_DIR/npm" "$SHIM_DIR/npx"

      - name: Run launcher with quarantine simulation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKDIR/$DELIVERY_DIR"

          NODE_ARCH="x64"
          if [ "$(uname -m)" = "arm64" ]; then
            NODE_ARCH="arm64"
          fi

          export HOME="$MOCK_HOME"
          export PATH="$SHIM_DIR:/usr/bin:/bin:/usr/sbin:/sbin"
          export FEISHU_CI_STATE_DIR="$GITHUB_WORKSPACE/mock-state"
          export FEISHU_CI_OPEN_LOG="$GITHUB_WORKSPACE/open-url.log"
          export FEISHU_SETUP_WORKSPACE="$MOCK_WORKSPACE"
          export FEISHU_SETUP_FORCE_NODE_DOWNLOAD=1
          export FEISHU_SETUP_NO_PAUSE=1
          export FEISHU_SETUP_PATH_OVERRIDE="$SHIM_DIR:$PWD/runtime/node-v24.15.0-darwin-${NODE_ARCH}/bin:/usr/bin:/bin:/usr/sbin:/sbin"

          if command -v lark-cli >/dev/null 2>&1; then
            echo "lark-cli should not exist before the setup install path runs"
            exit 20
          fi

          xattr -w com.apple.quarantine "0081;$(date +%s);GitHubActions;CI" start-feishu-setup.command
          spctl --assess --type execute -vv start-feishu-setup.command >> "$START_LOG" 2>&1 || true

          set +e
          ./start-feishu-setup.command >> "$START_LOG" 2>&1
          LAUNCH_EXIT=$?
          set -e

          echo "Launcher exit code: $LAUNCH_EXIT" | tee -a "$START_LOG"
          cat "$START_LOG"

          if [ "$LAUNCH_EXIT" -ne 0 ]; then
            exit "$LAUNCH_EXIT"
          fi

          test -x "runtime/node-v24.15.0-darwin-${NODE_ARCH}/bin/node"
          "runtime/node-v24.15.0-darwin-${NODE_ARCH}/bin/node" --version | grep -q "v24.15.0"

          if xattr -p com.apple.quarantine start-feishu-setup.command >/dev/null 2>&1; then
            echo "Launcher did not clear quarantine attribute"
            exit 21
          fi

          grep -q "Node.js runtime was not found. Downloading v24.15.0" "$START_LOG"
          grep -q "Node.js downloaded and verified. Extracting runtime" "$START_LOG"
          grep -q "v24.15.0" "$START_LOG"
          grep -q "lark-cli is missing. Running official one-click install." "$START_LOG"
          grep -q "\[mock npx\] official Feishu CLI install" "$START_LOG"
          grep -q "Feishu AI Agent Skills verified: 25/25" "$START_LOG"
          grep -q "SETUP_RESULT=SUCCESS" "$START_LOG"
          grep -q "identity=user" "$MOCK_HOME/feishu-setup-run.log"
          grep -q "tokenStatus=valid" "$MOCK_HOME/feishu-setup-run.log"

          SKILL_COUNT="$(find "$MOCK_HOME/.agents/skills" -name SKILL.md | wc -l | tr -d ' ')"
          if [ "$SKILL_COUNT" -ne 25 ]; then
            echo "Expected 25 mock skills, got $SKILL_COUNT"
            exit 22
          fi

          test -s "$GITHUB_WORKSPACE/open-url.log"
          grep -q "accounts.feishu.cn/macos-ci/auth" "$GITHUB_WORKSPACE/open-url.log"

          {
            echo "MACOS_TEST_RESULT=SUCCESS"
            echo "DELIVERY_ZIP=dist/$ZIP_NAME"
            echo "LAUNCH_EXIT_CODE=$LAUNCH_EXIT"
            echo "RUNNER_ARCH=$(uname -m)"
            echo "NODE_ARCH=$NODE_ARCH"
            echo "MOCK_SKILL_COUNT=$SKILL_COUNT"
            echo "QUARANTINE_CLEARED=true"
            echo "BUNDLED_NODE_USED=false"
            echo "NODE_DOWNLOAD_PATH_TESTED=true"
            echo "LARK_CLI_INSTALL_PATH_TESTED=true"
            echo "AUTH_FLOW_MOCKED=true"
          } > "$SUMMARY"

      - name: Upload macOS test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-setup-macos-test
          path: |
            dist/${{ env.ZIP_NAME }}
            start-run.log
            final-summary.txt
            open-url.log
            mock-home/feishu-setup-run.log
