name: Test FeishuSetup (macOS Runner)

on:
  workflow_dispatch: {}

jobs:
  test-zip:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List dist files
        run: |
          echo "Workspace: $(pwd)"
          ls -la dist || true

      - name: Unzip delivery package
        run: |
          if [ ! -f dist/FeishuSetup.zip ]; then
            echo "dist/FeishuSetup.zip not found"; exit 2
          fi
          unzip -l dist/FeishuSetup.zip
          unzip -o dist/FeishuSetup.zip -d ./workdir || true

      - name: Prepare launcher
        run: |
          cd workdir/FeishuSetup || (echo "workdir/FeishuSetup not found"; exit 3)
          chmod +x start-feishu-cli-setup.command || true
          echo "Listing workdir:"
          ls -la

      - name: Run launcher (capture stdout/stderr)
        run: |
          set -x
          cd workdir/FeishuSetup
          # Run the launcher; allow failure but capture output
          ./start-feishu-cli-setup.command > ../start-run.log 2>&1 || true
          echo "--- Launcher output ---"
          tail -n +1 ../start-run.log || true

      - name: Upload run logs
        uses: actions/upload-artifact@v4
        with:
          name: feishu-setup-test-logs
          path: workdir/start-run.log
